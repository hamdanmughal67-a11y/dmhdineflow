server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # React Single Page App routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API requests to backend
    location /api/ {
        proxy_pass http://dineflow-server:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Uploads
    location /uploads/ {
        proxy_pass http://dineflow-server:3001/uploads/;
        proxy_set_header Host $host;
    }

    # Proxy WebSockets (Socket.IO)
    location /socket.io/ {
        proxy_pass http://dineflow-server:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
